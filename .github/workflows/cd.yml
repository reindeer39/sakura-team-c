name: CD

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "app/backend/**/*.go"
      - "app/backend/go.mod"
      - "app/backend/go.sum"
      - "app/backend/Dockerfile"
      - "app/backend/compose.prod.yaml"
      - "app/backend/Caddyfile"
      - "app/backend/migrations/**"
      - "deploy/deploy.sh"
      - ".github/workflows/cd.yml"

  workflow_dispatch:

concurrency:
  group: production-cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'infra/terraform/**'
              - '.github/workflows/cd.yml'
            backend:
              - 'app/backend/**/*.go'
              - 'app/backend/go.mod'
              - 'app/backend/go.sum'
              - 'app/backend/Dockerfile'
              - 'app/backend/compose.prod.yaml'
              - 'app/backend/Caddyfile'
              - 'app/backend/migrations/**'
              - 'deploy/deploy.sh'
              - '.github/workflows/cd.yml'

  terraform:
    name: Terraform Apply
    needs: changes
    if: |
      always() &&
      (needs.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_IN_AUTOMATION: "true"
      SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
      SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_VAR_server_password: ${{ secrets.SERVER_PASSWORD }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=sakura-team-c/terraform.tfstate" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}" \
            -backend-config='endpoints={s3="${{ secrets.TF_STATE_ENDPOINT }}"}' \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="use_path_style=true"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  backend:
    name: Backend Deploy
    needs: [changes, terraform]
    if: |
      always() &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    env:
      DEPLOY_PORT: "22222"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name
        env:
          REGISTRY_HOST: ${{ secrets.SAKURA_REGISTRY_HOST }}
        run: |
          echo "IMAGE_NAME=${REGISTRY_HOST}/intern2026-app-backend" >> "$GITHUB_ENV"

      - name: Login to Sakura Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.SAKURA_REGISTRY_HOST }}
          username: ${{ secrets.SAKURA_REGISTRY_USERNAME }}
          password: ${{ secrets.SAKURA_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Resolve monitoring suite endpoints
        working-directory: infra/terraform
        env:
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=sakura-team-c/terraform.tfstate" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}" \
            -backend-config='endpoints={s3="${{ secrets.TF_STATE_ENDPOINT }}"}' \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="use_path_style=true"
          for name in LOGS METRICS; do
            lower="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
            endpoint="$(terraform output -raw "monitoring_${lower}_endpoint")"
            token="$(terraform output -raw "monitoring_${lower}_token")"
            if [ -z "$endpoint" ] || [ -z "$token" ]; then
              echo "monitoring suite outputs are not available yet"
              exit 1
            fi
            echo "::add-mask::$token"
            printf '%s_ENDPOINT=%s\n%s_TOKEN=%s\n' "$name" "$endpoint" "$name" "$token" >> "$GITHUB_ENV"
          done

      - name: Render collector config
        run: |
          sed -i \
            -e "s|REPLACE_LOGS_ENDPOINT|${LOGS_ENDPOINT}|" \
            -e "s|REPLACE_LOGS_TOKEN|${LOGS_TOKEN}|" \
            -e "s|REPLACE_METRICS_ENDPOINT|${METRICS_ENDPOINT}|" \
            -e "s|REPLACE_METRICS_TOKEN|${METRICS_TOKEN}|" \
            app/backend/otel-collector.yaml
          if grep -q REPLACE_ app/backend/otel-collector.yaml; then
            echo "collector config still contains placeholders"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p /opt/sakuravel"

      - name: Generate deployment .env
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          APP_DB_USER: ${{ vars.APP_DB_USER }}
          APP_DB_NAME: ${{ vars.APP_DB_NAME }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          APP_DB_ROOT_PASSWORD: ${{ secrets.APP_DB_ROOT_PASSWORD || secrets.APP_DB_PASSWORD }}
          APP_FRONTEND_IMAGE: ${{ vars.APP_FRONTEND_IMAGE || format('{0}/intern2026-app-frontend:latest', secrets.SAKURA_REGISTRY_HOST) }}
        run: |
          cat <<EOF > /tmp/deploy.env
          APP_DOMAIN=${APP_DOMAIN}
          APP_DB_USER=${APP_DB_USER}
          APP_DB_NAME=${APP_DB_NAME}
          APP_DB_PASSWORD=${APP_DB_PASSWORD}
          APP_DB_ROOT_PASSWORD=${APP_DB_ROOT_PASSWORD}
          APP_FRONTEND_IMAGE=${APP_FRONTEND_IMAGE}
          EOF

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -P "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            /tmp/deploy.env \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/sakuravel/.env"
          scp -P "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            deploy/deploy.sh \
            app/backend/compose.prod.yaml \
            app/backend/otel-collector.yaml \
            app/backend/Caddyfile \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/sakuravel/"
          scp -r -P "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            app/backend/migrations \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/sakuravel/"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 600 /opt/sakuravel/.env"

      - name: Login to registry from VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_HOST: ${{ secrets.SAKURA_REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.SAKURA_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SAKURA_REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" |
            ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "docker login '${REGISTRY_HOST}' \
                --username '${REGISTRY_USERNAME}' \
                --password-stdin"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x /opt/sakuravel/deploy.sh && \
             /opt/sakuravel/deploy.sh '${IMAGE_NAME}:${GITHUB_SHA}'"

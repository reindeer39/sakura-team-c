services:
  api:
    image: ${APP_BACKEND_IMAGE:?APP_BACKEND_IMAGE is required}
    platform: linux/amd64
    # ports:
    #   - "8080:8080"
    environment:
      - DATABASE_URL=${APP_DB_USER:?APP_DB_USER is required}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@tcp(db:3306)/${APP_DB_NAME:?APP_DB_NAME is required}?parseTime=true&charset=utf8mb4
      - PORT=8080
      # ブラウザから見たフロントエンドのオリジン（Caddy 経由で同一オリジン）
      - ALLOWED_ORIGIN=https://${APP_DOMAIN:?APP_DOMAIN is required}
      - COOKIE_SECURE=true   # HTTPS 配信時
      - LOG_OUTPUT=${LOG_OUTPUT:-otlp}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=sakuravel-api
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mariadb:10.11
    command:
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=1
    environment:
      MYSQL_DATABASE: ${APP_DB_NAME:?APP_DB_NAME is required}
      MYSQL_USER: ${APP_DB_USER:?APP_DB_USER is required}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${APP_DB_ROOT_PASSWORD:?APP_DB_ROOT_PASSWORD is required}
    # ports:
    #   - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: intern22.sakuracr.jp/intern2026-app-frontend:latest
    platform: linux/amd64
    # ports:
    #   - "3000:3000"
    environment:
      # ブラウザから直接叩くバックエンドURL。/api/config 経由でブラウザに渡される
      - API_URL=https://${APP_DOMAIN:?APP_DOMAIN is required}/api
    depends_on:
      - api
    restart: on-failure

  otel-collector:
    image: ghcr.io/sacloud/sacloud-otel-collector:latest
    user: "0:4"
    command: ["--config", "/etc/otel/config.yaml"]
    restart: unless-stopped
    logging:
      driver: local
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - /:/hostfs:ro
      - mariadb_data:/var/lib/mysql:ro

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?APP_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: app-network

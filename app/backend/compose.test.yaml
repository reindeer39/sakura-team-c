services:
  db-test:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: sakuravel
      MYSQL_USER: sakuravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    # volumes:
    #   - mariadb_data_test:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u sakuravel -ppassword"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  mariadb_data_test:

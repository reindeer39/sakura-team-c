services:
  api:
    image: ${BACKEND_IMAGE:-sakuravel-backend:local}
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sakuravel:password@tcp(db:3306)/sakuravel?parseTime=true&charset=utf8mb4}
      PORT: ${PORT:-8080}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://teamc.intern28.sakuraha.jp}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: sakuravel
      MYSQL_USER: sakuravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d/
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u sakuravel -ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: sakura-intern8.sakuracr.jp/intern2026-app-frontend:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      API_URL: ${API_URL:-https://teamc.intern28.sakuraha.jp/api}
    depends_on:
      - api
    restart: on-failure
  
  caddy:
    image: caddy:2.8.5
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - frontend

volumes:
  mariadb_data:
  caddy_data:

networks:
  default:
    name: app-network

services:
  api:
    image: sakura-intern8.sakuracr.jp/intern2026-app-backend:latest
    platform: linux/amd64
    # ports:
    #   - "8080:8080"
    environment:
      - DATABASE_URL=sakuravel:password@tcp(db:3306)/sakuravel?parseTime=true&charset=utf8mb4
      - PORT=8080
      # ブラウザから見たフロントエンドのオリジン（Caddy 経由で同一オリジン）
      - ALLOWED_ORIGIN=https://teamc.intern28.sakuraha.jp
      - COOKIE_SECURE=true   # HTTPS 配信時
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: sakuravel
      MYSQL_USER: sakuravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    # ports:
    #   - "3306:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d/
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u sakuravel -ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: sakura-intern8.sakuracr.jp/intern2026-app-frontend:latest
    platform: linux/amd64
    # ports:
    #   - "3000:3000"
    environment:
      # ブラウザから直接叩くバックエンドURL。/api/config 経由でブラウザに渡される
      - API_URL=https://teamc.intern28.sakuraha.jp/api
    depends_on:
      - api
    restart: on-failure

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: app-network
